name: Release OCI images

on:
  workflow_dispatch:
    inputs:
      rikune_analyzer_image:
        description: Published static Rikune image for the pinned source revision (repository@sha256)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: strad-release-${{ github.sha }}
  cancel-in-progress: false

env:
  STRAD_IMAGE_NAME: ghcr.io/steadholme/strad
  STRAD_ANALYZER_IMAGE_NAME: ghcr.io/steadholme/strad-analyzer
  STRAD_FACADE_IMAGE_NAME: ghcr.io/steadholme/strad-analyze-facade
  STRAD_RUST_BUILDER_IMAGE: docker.io/library/rust@sha256:31ee7fc65186be7e0e0ccb3f2ca305f14e4739e7642a1ae65753aa5d7b874523
  STRAD_RUNTIME_IMAGE: gcr.io/distroless/cc-debian13@sha256:a77defd6fedbb3392b175ba8ea3d1c22be963c1597c248c3ba987ddd80bfb512
  STRAD_NODE_BUILDER_IMAGE: docker.io/library/node@sha256:d649c27dae7ba0137b3cef5dd75baa422c08dc3d9e3fc0c23dfb172dc3cc6436
  RIKUNE_ANALYZER_IMAGE: ${{ inputs.rikune_analyzer_image }}
  RIKUNE_EXPECTED_SOURCE_REVISION: 61e354c5bb7625db30a1132d62b3a2fdb829e8f8
  RIKUNE_STATIC_LOCK_SHA256: 32e3ea5103ff73c413062b17ad3bb4e7270fbcd6fd1325f6a7f3dc831bee83ef
  COSIGN_IDENTITY: https://github.com/Steadholme/strad/.github/workflows/release.yml@refs/heads/main
  COSIGN_ISSUER: https://token.actions.githubusercontent.com

jobs:
  release:
    name: Build, attest, and sign
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Bind release to main
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"
          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${RIKUNE_ANALYZER_IMAGE}" =~ ^ghcr\.io/last-emo-boy/rikune-analyzer-static@sha256:[0-9a-f]{64}$ ]]

      - name: Require successful CI for the exact revision
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?filter=latest&per_page=100" |
            python3 ops/analyze/verify_release_ci.py "${GITHUB_SHA}"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.36.1
          driver-opts: |
            image=docker.io/moby/buildkit@sha256:040d34121c27906c4ff9ac152a30d52bf2c5d328d3bb748916bb3d2743c02528

      - name: Verify the corrected Rikune static source pin
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${RIKUNE_ANALYZER_IMAGE}" --format '{{json .Image.Config.Labels}}' |
            jq -e --arg revision "${RIKUNE_EXPECTED_SOURCE_REVISION}" \
              '."org.opencontainers.image.revision" == $revision'
          gh attestation verify "oci://${RIKUNE_ANALYZER_IMAGE}" \
            --repo Last-emo-boy/rikune \
            --source-digest "${RIKUNE_EXPECTED_SOURCE_REVISION}" >/dev/null

      - name: Build and push Strad
        id: strad
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.STRAD_IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            STRAD_RUST_BUILDER_IMAGE=${{ env.STRAD_RUST_BUILDER_IMAGE }}
            STRAD_RUNTIME_IMAGE=${{ env.STRAD_RUNTIME_IMAGE }}
            STRAD_REVISION=${{ github.sha }}

      - name: Build and push Strad analyzer
        id: analyzer
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.analyzer
          platforms: linux/amd64
          pull: true
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.STRAD_ANALYZER_IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            STRAD_NODE_BUILDER_IMAGE=${{ env.STRAD_NODE_BUILDER_IMAGE }}
            RIKUNE_ANALYZER_IMAGE=${{ env.RIKUNE_ANALYZER_IMAGE }}
            STRAD_REVISION=${{ github.sha }}

      - name: Build and push Analyze facade
        id: facade
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.facade
          platforms: linux/amd64
          pull: true
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.STRAD_FACADE_IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            STRAD_NODE_BUILDER_IMAGE=${{ env.STRAD_NODE_BUILDER_IMAGE }}

      - name: Verify image structure and BuildKit attestations
        shell: bash
        env:
          STRAD_DIGEST: ${{ steps.strad.outputs.digest }}
          ANALYZER_DIGEST: ${{ steps.analyzer.outputs.digest }}
          FACADE_DIGEST: ${{ steps.facade.outputs.digest }}
        run: |
          set -euo pipefail
          for digest in "${STRAD_DIGEST}" "${ANALYZER_DIGEST}" "${FACADE_DIGEST}"; do
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          done
          strad_ref="${STRAD_IMAGE_NAME}@${STRAD_DIGEST}"
          analyzer_ref="${STRAD_ANALYZER_IMAGE_NAME}@${ANALYZER_DIGEST}"
          facade_ref="${STRAD_FACADE_IMAGE_NAME}@${FACADE_DIGEST}"
          for ref in "${strad_ref}" "${analyzer_ref}" "${facade_ref}"; do
            docker buildx imagetools inspect "${ref}" --raw |
              jq -e '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | length == 1'
            docker buildx imagetools inspect "${ref}" --format '{{json .Provenance}}' |
              jq -e 'type == "object" and length > 0'
            docker buildx imagetools inspect "${ref}" --format '{{json .SBOM}}' |
              jq -e 'type == "object" and length > 0'
            docker buildx imagetools inspect "${ref}" --format '{{json .Image.Config.Labels}}' |
              jq -e --arg revision "${GITHUB_SHA}" '."org.opencontainers.image.revision" == $revision'
          done
          docker buildx imagetools inspect "${analyzer_ref}" --format '{{json .Image.Config.Labels}}' |
            jq -e --arg base "${RIKUNE_ANALYZER_IMAGE}" '."org.opencontainers.image.base.name" == $base'

      - name: Verify runtime contracts
        shell: bash
        env:
          STRAD_DIGEST: ${{ steps.strad.outputs.digest }}
          ANALYZER_DIGEST: ${{ steps.analyzer.outputs.digest }}
          FACADE_DIGEST: ${{ steps.facade.outputs.digest }}
        run: |
          set -euo pipefail
          strad_ref="${STRAD_IMAGE_NAME}@${STRAD_DIGEST}"
          analyzer_ref="${STRAD_ANALYZER_IMAGE_NAME}@${ANALYZER_DIGEST}"
          docker run --rm \
            --env STRAD_NEWAPI_MODEL=release-contract \
            --env STRAD_NEWAPI_CONTEXT_TOKENS=32768 \
            "${strad_ref}" runtime-contract |
            jq -e \
              '.newapi_model == "release-contract" and .newapi_context_tokens == 32768'
          docker run --rm \
            --env RIKUNE_STATIC_LOCK_SHA256="${RIKUNE_STATIC_LOCK_SHA256}" \
            --entrypoint /usr/local/bin/node \
            "${analyzer_ref}" \
            --input-type=module \
            --eval '
              import { createRequire } from "node:module";
              const require = createRequire(import.meta.url);
              const Database = require("better-sqlite3");
              const database = new Database(":memory:");
              database.exec("SELECT 1");
              database.close();
              const contract = await import("./dist/src/static-lock.js");
              if (contract.STATIC_PROFILE_LOCK_SHA256 !== process.env.RIKUNE_STATIC_LOCK_SHA256) {
                throw new Error("Rikune static lock differs from the release input");
              }
              const lock = await contract.loadAndVerifyStaticLock("/app/static-profile.lock.json");
              const constants = await import("./dist/src/constants.js");
              contract.validateStaticBackendEnvironment(lock, constants.CHILD_ENV_BASE);
              if (process.getuid?.() !== 1000) {
                throw new Error("analyzer runtime user differs from the container contract");
              }
            '

          docker run --rm --network none \
            --entrypoint /usr/local/bin/node \
            "${STRAD_FACADE_IMAGE_NAME}@${FACADE_DIGEST}" \
            --input-type=module --eval '
              import assert from "node:assert/strict";
              import { access } from "node:fs/promises";
              import { PUBLIC_TOOLS } from "./dist/src/tools.js";
              assert.deepEqual(PUBLIC_TOOLS, ["analysis.create", "analysis.read", "analysis.conversation", "analysis.upload.cancel"]);
              assert.equal(process.getuid?.(), 1000);
              await access("./dist/src/index.js");
              await access("./dist/src/healthcheck.js");
              await access("./migrations");
            '

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign image digests
        shell: bash
        env:
          STRAD_DIGEST: ${{ steps.strad.outputs.digest }}
          ANALYZER_DIGEST: ${{ steps.analyzer.outputs.digest }}
          FACADE_DIGEST: ${{ steps.facade.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${STRAD_IMAGE_NAME}@${STRAD_DIGEST}"
          cosign sign --yes "${STRAD_ANALYZER_IMAGE_NAME}@${ANALYZER_DIGEST}"
          cosign sign --yes "${STRAD_FACADE_IMAGE_NAME}@${FACADE_DIGEST}"

      - name: Attest Strad provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.STRAD_IMAGE_NAME }}
          subject-digest: ${{ steps.strad.outputs.digest }}
          push-to-registry: true

      - name: Attest analyzer provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.STRAD_ANALYZER_IMAGE_NAME }}
          subject-digest: ${{ steps.analyzer.outputs.digest }}
          push-to-registry: true

      - name: Attest facade provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.STRAD_FACADE_IMAGE_NAME }}
          subject-digest: ${{ steps.facade.outputs.digest }}
          push-to-registry: true

      - name: Verify signatures and GitHub attestations
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STRAD_DIGEST: ${{ steps.strad.outputs.digest }}
          ANALYZER_DIGEST: ${{ steps.analyzer.outputs.digest }}
          FACADE_DIGEST: ${{ steps.facade.outputs.digest }}
        run: |
          set -euo pipefail
          for ref in \
            "${STRAD_IMAGE_NAME}@${STRAD_DIGEST}" \
            "${STRAD_ANALYZER_IMAGE_NAME}@${ANALYZER_DIGEST}" \
            "${STRAD_FACADE_IMAGE_NAME}@${FACADE_DIGEST}"; do
            cosign verify \
              --certificate-identity "${COSIGN_IDENTITY}" \
              --certificate-oidc-issuer "${COSIGN_ISSUER}" \
              "${ref}" >/dev/null
            gh attestation verify "oci://${ref}" --repo "${GITHUB_REPOSITORY}" \
              --source-digest "${GITHUB_SHA}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" >/dev/null
          done

      - name: Create signed release manifest
        shell: bash
        env:
          STRAD_DIGEST: ${{ steps.strad.outputs.digest }}
          ANALYZER_DIGEST: ${{ steps.analyzer.outputs.digest }}
          FACADE_DIGEST: ${{ steps.facade.outputs.digest }}
        run: |
          set -euo pipefail
          jq -n \
            --arg issued_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg source_revision "${GITHUB_SHA}" \
            --arg source_repository "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --arg strad_image "${STRAD_IMAGE_NAME}@${STRAD_DIGEST}" \
            --arg analyzer_image "${STRAD_ANALYZER_IMAGE_NAME}@${ANALYZER_DIGEST}" \
            --arg rust_builder "${STRAD_RUST_BUILDER_IMAGE}" \
            --arg runtime "${STRAD_RUNTIME_IMAGE}" \
            --arg node_builder "${STRAD_NODE_BUILDER_IMAGE}" \
            --arg rikune_base "${RIKUNE_ANALYZER_IMAGE}" \
            --arg rikune_static_lock_sha256 "${RIKUNE_STATIC_LOCK_SHA256}" \
            '{
              schema_version: 1,
              issued_at: $issued_at,
              source_repository: $source_repository,
              source_revision: $source_revision,
              platform: "linux/amd64",
              images: {
                STRAD_IMAGE: $strad_image,
                STRAD_ANALYZER_IMAGE: $analyzer_image
              },
              build_inputs: {
                STRAD_RUST_BUILDER_IMAGE: $rust_builder,
                STRAD_RUNTIME_IMAGE: $runtime,
                STRAD_NODE_BUILDER_IMAGE: $node_builder,
                RIKUNE_ANALYZER_IMAGE: $rikune_base,
                RIKUNE_STATIC_LOCK_SHA256: $rikune_static_lock_sha256
              }
            }' >release-images.json
          # Preserve the legacy two-image manifest consumed by frozen Holdfast
          # releases. Analyze gets its own signed, three-component manifest.
          jq \
            --arg facade_image "${STRAD_FACADE_IMAGE_NAME}@${FACADE_DIGEST}" \
            --arg rikune_source_revision "${RIKUNE_EXPECTED_SOURCE_REVISION}" \
            --arg legacy_manifest_sha256 "$(sha256sum release-images.json | cut -d' ' -f1)" \
            '. + {
              scope: "strad-analyze-components",
              rikune_source_revision: $rikune_source_revision,
              strad_release_manifest_sha256: $legacy_manifest_sha256,
              images: {
                ANALYZE_STRAD_IMAGE: .images.STRAD_IMAGE,
                ANALYZE_ANALYZER_IMAGE: .images.STRAD_ANALYZER_IMAGE,
                ANALYZE_FACADE_IMAGE: $facade_image
              }
            }' release-images.json >analyze-images.json
          for manifest in release-images analyze-images; do
            sha256sum "${manifest}.json" >"${manifest}.sha256"
            cosign sign-blob --yes --bundle "${manifest}.sigstore.json" "${manifest}.json"
            cosign verify-blob \
              --bundle "${manifest}.sigstore.json" \
              --certificate-identity "${COSIGN_IDENTITY}" \
              --certificate-oidc-issuer "${COSIGN_ISSUER}" \
              "${manifest}.json"
          done

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strad-oci-release-${{ github.sha }}
          path: |
            release-images.json
            release-images.sha256
            release-images.sigstore.json
            analyze-images.json
            analyze-images.sha256
            analyze-images.sigstore.json
          if-no-files-found: error
          retention-days: 90
